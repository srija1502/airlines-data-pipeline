version: '3.8'

x-airflow-common: &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airline_user:devtest@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "super_secret_key"
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ---------------------------
  # PostgreSQL
  # ---------------------------
  postgres:
    image: postgres:13
    container_name: postgres_container
    restart: always

    environment:
      POSTGRES_USER: airline_user
      POSTGRES_PASSWORD: devtest
      POSTGRES_DB: airflow

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline_user"]
      interval: 5s
      retries: 5

  # ---------------------------
  # Airflow Init (FIXED)
  # ---------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command: >
      -c "airflow db init && airflow users create \
      --username admin \
      --password 12345 \
      --firstname admin \
      --lastname user \
      --role Admin \
      --email admin@example.com"

  # ---------------------------
  # Webserver
  # ---------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    restart: always
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------
  # Scheduler
  # ---------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    restart: always
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data: